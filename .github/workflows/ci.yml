# CI (PLAN §11.1, D-038, D-065). No lockfile can be generated offline, so installs use `npm install` with the exact
# pins of package.json (no `npm ci`, no npm cache); tools/link-local-deps.mjs --verify-only fails loudly on drift.
# Locally the same gates run offline as: node tools/link-local-deps.mjs && npm run check (PLAN §11.3).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · validate · build · e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc          # 22; no `cache: npm` — there is no lockfile to key on

      - name: Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install (exact pins, no lockfile)
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Verify pinned versions
        run: node tools/link-local-deps.mjs --verify-only   # same version check as the offline bootstrap, no linking

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage gate
        run: npm test

      - name: Validate content
        run: npm run validate

      - name: Build (dist/, relative URLs, size budget)
        run: npm run build

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (builds dist-e2e/, serves it statically)
        run: npm run test:e2e -- --grep @smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e-full:
    name: e2e full (both viewports, a11y)
    needs: verify
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/unraveling' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: npm install --no-audit --no-fund --no-package-lock
      - id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep-invert @screens
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 7

  sim:
    name: balance batch (nightly / dispatch)
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run sim:balance
      - uses: actions/upload-artifact@v4
        with:
          name: balance
          path: docs/BALANCE.md
