# GitHub Pages (PLAN §11.2, D-038). Builds dist/ (relative asset URLs, so it works at /Aethelgard/ or any path).
# Deploys ONLY from main (push or dispatch); a dispatch on `unraveling` builds the artifact but never deploys.
# One-time repository setting: Settings -> Pages -> Source = GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:            # dispatch on `unraveling` builds the artifact; only `main` deploys

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run build                     # validate + esbuild → dist/ with relative asset URLs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
